[workspace]
authors = ["Federico Aprile <fgaprile@ucdavis.edu>", "Wesley Brooks <wbrooks@ucdavis.edu>"]
channels = ["conda-forge"]
name = "libbot_bert"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[tasks.ollama-serve]
cmd = "ollama serve"
env.OLLAMA_MODELS = "/dsl/2026_va_ai_pt_chatbot/coul-adaptation/output/ollama_cache"

[tasks.ollama-pull]
cmd = "ollama pull"
env.OLLAMA_MODELS = "/dsl/2026_va_ai_pt_chatbot/coul-adaptation/output/ollama_cache"

[tasks.ollama-list]
cmd = "ollama list"
env.OLLAMA_MODELS = "/dsl/2026_va_ai_pt_chatbot/coul-adaptation/output/ollama_cache"

[tasks.ollama-run]
cmd = "ollama run"
env.OLLAMA_MODELS = "/dsl/2026_va_ai_pt_chatbot/coul-adaptation/output/ollama_cache"

[tasks.ollama-rm]
cmd = "ollama rm"
env.OLLAMA_MODELS = "/dsl/2026_va_ai_pt_chatbot/coul-adaptation/output/ollama_cache"

[system-requirements]
#cuda = "13"

[dependencies]
#cuda = "*"
#pytorch = {version="*", build="*cuda*"}
pytorch = "*"
python = "*"
numpy = "*"
pandas = "*"
transformers = "*"
sentence-transformers = "*"
pyarrow = "*"
einops = "*"
ollama-python = "*"
chromadb = "*"
psutil = "*"
scikit-learn = "*"
matplotlib = "*"
seaborn = "*"
pydantic = "*"
fastapi = "*"
pydantic-settings = "*"
uvicorn = "*"
httpx = "*"
ollama = "*"
jupyter = "*"
ipykernel = "*"
nltk = "*"
numactl = "*"
r = "*"
r-jsonlite = "*"
r-tidyverse = "*"






